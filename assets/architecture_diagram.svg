    <!-- Item 1 -->
    <g transform="translate(12, 54)">
      <rect width="211" height="56" rx="8" fill="#061a15" stroke="#0f4c3a" stroke-width="1" />
      <text x="10" y="22" class="item-title">🌊 Dynamic AOI Engine</text>
      <text x="10" y="40" class="item-desc">Slope &amp; flow-dilated risk envelope</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(12, 118)">
      <rect width="211" height="56" rx="8" fill="#061a15" stroke="#0f4c3a" stroke-width="1" />
      <text x="10" y="22" class="item-title">📐 5×5 Spatial Hazard Grid</text>
      <text x="10" y="40" class="item-desc">25-cell runoff decay raster (1.0 km)</text>
