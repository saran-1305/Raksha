<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c2042"/><stop offset="100%" stop-color="#071224"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#062b23"/><stop offset="100%" stop-color="#031713"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2106"/><stop offset="100%" stop-color="#171103"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26123d"/><stop offset="100%" stop-color="#140921"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 15px; fill: #38bdf8; }
    .subtitle { font-family: monospace; font-size: 10px; fill: #94a3b8; }
    .col-hdr { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 800; }
    .item-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #f8fafc; }
  </style>

  <!-- Canvas -->
  <rect width="1000" height="310" rx="12" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(20, 12)">
    <rect width="960" height="30" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="20" class="title">RAKSHA 2.0 • SYSTEM ARCHITECTURE PIPELINE</text>
    <text x="946" y="20" class="subtitle" text-anchor="end">EXPLAINABLE DECISION INTELLIGENCE</text>
  </g>

  <!-- COL 1: SATELLITE -->
  <g transform="translate(20, 52)">
    <rect width="224" height="242" rx="8" fill="url(#g1)" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="224" height="32" rx="8" fill="#0369a1" fill-opacity="0.25"/>
    <text x="14" y="21" class="col-hdr" fill="#38bdf8">1. SATELLITE FEEDS</text>
    
    <g transform="translate(8, 40)"><rect width="208" height="32" rx="5" fill="#0f172a" stroke="#1e293b"/><circle cx="15" cy="16" r="3.5" fill="#38bdf8"/><text x="26" y="20" class="item-txt">Sentinel-1 SAR (Radar)</text></g>
    <g transform="translate(8, 79)"><rect width="208" height="32" rx="5" fill="#0f172a" stroke="#1e293b"/><circle cx="15" cy="16" r="3.5" fill="#38bdf8"/><text x="26" y="20" class="item-txt">Sentinel-2 L2A (Optical)</text></g>
    <g transform="translate(8, 118)"><rect width="208" height="32" rx="5" fill="#0f172a" stroke="#1e293b"/><circle cx="15" cy="16" r="3.5" fill="#38bdf8"/><text x="26" y="20" class="item-txt">ISRO Cartosat-3 (0.28m)</text></g>
    <g transform="translate(8, 157)"><rect width="208" height="32" rx="5" fill="#0f172a" stroke="#1e293b"/><circle cx="15" cy="16" r="3.5" fill="#38bdf8"/><text x="26" y="20" class="item-txt">ISRO Bhuvan (1:50k LULC)</text></g>
    <g transform="translate(8, 196)"><rect width="208" height="32" rx="5" fill="#0f172a" stroke="#1e293b"/><circle cx="15" cy="16" r="3.5" fill="#38bdf8"/><text x="26" y="20" class="item-txt">SRTM DEM &amp; Weather</text></g>
  </g>

  <g transform="translate(248, 172)">
    <line x1="0" y1="0" x2="10" y2="0" stroke="#64748b" stroke-width="2"/>
    <polygon points="10,-4 15,0 10,4" fill="#64748b"/>
  </g>

  <!-- COL 2: AI CORE -->
  <g transform="translate(268, 52)">
    <rect width="224" height="242" rx="8" fill="url(#g2)" stroke="#059669" stroke-width="1.5"/>
    <rect width="224" height="32" rx="8" fill="#059669" fill-opacity="0.25"/>
    <text x="14" y="21" class="col-hdr" fill="#34d399">2. AI DECISION CORE</text>
    
    <g transform="translate(8, 40)"><rect width="208" height="32" rx="5" fill="#0f172a" stroke="#1e293b"/><circle cx="15" cy="16" r="3.5" fill="#34d399"/><text x="26" y="20" class="item-txt">Dynamic Hazard AOI</text></g>
    <g transform="translate(8, 79)"><rect width="208" height="32" rx="5" fill="#0f172a" stroke="#1e293b"/><circle cx="15" cy="16" r="3.5" fill="#34d399"/><text x="26" y="20" class="item-txt">5×5 Spatial Risk Grid</text></g>
    <g transform="translate(8, 118)"><rect width="208" height="32" rx="5" fill="#0f172a" stroke="#1e293b"/><circle cx="15" cy="16" r="3.5" fill="#34d399"/><text x="26" y="20" class="item-txt">Zero-Tolerance Veto</text></g>
    <g transform="translate(8, 157)"><rect width="208" height="32" rx="5" fill="#0f172a" stroke="#1e293b"/><circle cx="15" cy="16" r="3.5" fill="#34d399"/><text x="26" y="20" class="item-txt">Sphere Capacity Sizing</text></g>
    <g transform="translate(8, 196)"><rect width="208" height="32" rx="5" fill="#0f172a" stroke="#1e293b"/><circle cx="15" cy="16" r="3.5" fill="#34d399"/><text x="26" y="20" class="item-txt">100-Point MCDA Ranking</text></g>
  </g>

  <g transform="translate(496, 172)">
    <line x1="0" y1="0" x2="10" y2="0" stroke="#64748b" stroke-width="2"/>
    <polygon points="10,-4 15,0 10,4" fill="#64748b"/>
  </g>

  <!-- COL 3: COMMAND CENTER -->
  <g transform="translate(516, 52)">
    <rect width="224" height="242" rx="8" fill="url(#g3)" stroke="#d97706" stroke-width="1.5"/>
    <rect width="224" height="32" rx="8" fill="#d97706" fill-opacity="0.25"/>
    <text x="14" y="21" class="col-hdr" fill="#fbbf24">3. COMMAND CENTER</text>
    
    <g transform="translate(8, 40)"><rect width="208" height="32" rx="5" fill="#0f172a" stroke="#1e293b"/><circle cx="15" cy="16" r="3.5" fill="#fbbf24"/><text x="26" y="20" class="item-txt">Leaflet GIS Map Layers</text></g>
    <g transform="translate(8, 79)"><rect width="208" height="32" rx="5" fill="#0f172a" stroke="#1e293b"/><circle cx="15" cy="16" r="3.5" fill="#fbbf24"/><text x="26" y="20" class="item-txt">12-pt DEM Transect Chart</text></g>
    <g transform="translate(8, 118)"><rect width="208" height="32" rx="5" fill="#0f172a" stroke="#1e293b"/><circle cx="15" cy="16" r="3.5" fill="#fbbf24"/><text x="26" y="20" class="item-txt">6-Stage Decision Stepper</text></g>
    <g transform="translate(8, 157)"><rect width="208" height="32" rx="5" fill="#0f172a" stroke="#1e293b"/><circle cx="15" cy="16" r="3.5" fill="#fbbf24"/><text x="26" y="20" class="item-txt">Emergency Access Boundary [ARCH]</text></g>
    <g transform="translate(8, 196)"><rect width="208" height="32" rx="5" fill="#0f172a" stroke="#1e293b"/><circle cx="15" cy="16" r="3.5" fill="#fbbf24"/><text x="26" y="20" class="item-txt">Cinematic Landing Portal</text></g>
  </g>

  <g transform="translate(744, 172)">
    <line x1="0" y1="0" x2="10" y2="0" stroke="#64748b" stroke-width="2"/>
    <polygon points="10,-4 15,0 10,4" fill="#64748b"/>
  </g>

  <!-- COL 4: ACTION & LOGISTICS -->
  <g transform="translate(764, 52)">
    <rect width="216" height="242" rx="8" fill="url(#g4)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="216" height="32" rx="8" fill="#8b5cf6" fill-opacity="0.25"/>
    <text x="14" y="21" class="col-hdr" fill="#c084fc">4. OPERATIONAL ACTION</text>
    
    <g transform="translate(8, 40)"><rect width="200" height="32" rx="5" fill="#0f172a" stroke="#1e293b"/><circle cx="15" cy="16" r="3.5" fill="#c084fc"/><text x="26" y="20" class="item-txt">Official DDMA Dossier</text></g>
    <g transform="translate(8, 79)"><rect width="200" height="32" rx="5" fill="#0f172a" stroke="#1e293b"/><circle cx="15" cy="16" r="3.5" fill="#c084fc"/><text x="26" y="20" class="item-txt">QGIS Incident GeoJSON</text></g>
    <g transform="translate(8, 118)"><rect width="200" height="32" rx="5" fill="#0f172a" stroke="#1e293b"/><circle cx="15" cy="16" r="3.5" fill="#c084fc"/><text x="26" y="20" class="item-txt">Evacuation Fleet Logistics</text></g>
    <g transform="translate(8, 157)"><rect width="200" height="32" rx="5" fill="#0f172a" stroke="#1e293b"/><circle cx="15" cy="16" r="3.5" fill="#c084fc"/><text x="26" y="20" class="item-txt">Humanitarian Relief Quotas</text></g>
    <g transform="translate(8, 196)"><rect width="200" height="32" rx="5" fill="#0f172a" stroke="#1e293b"/><circle cx="15" cy="16" r="3.5" fill="#c084fc"/><text x="26" y="20" class="item-txt">100% Zero-Deficit Goal</text></g>
  </g>
</svg>
