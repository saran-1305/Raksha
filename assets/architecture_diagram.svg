      <text x="10" y="40" class="item-desc">Slope &gt;14° &amp; floodway elimination</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(12, 246)">
      <rect width="211" height="56" rx="8" fill="#061a15" stroke="#0f4c3a" stroke-width="1" />
      <text x="10" y="22" class="item-title">⛺ Sphere Capacity Sizing</text>
      <text x="10" y="40" class="item-desc">45 m²/person @ 60% usable footprint</text>
    </g>

    <!-- Item 5 -->
    <g transform="translate(12, 310)">
      <rect width="211" height="56" rx="8" fill="#061a15" stroke="#0f4c3a" stroke-width="1" />
      <text x="10" y="22" class="item-title">⚖️ 100-Pt MCDA Ranking</text>
      <text x="10" y="40" class="item-desc">Safety(30) + Cap(25) + Access(15) ...</text>
    </g>
  </g>

  <!-- Connective Arrow 2 -> 3 -->
  <g transform="translate(538, 260)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#34d399" stroke-width="3" stroke-dasharray="5,3" />
    <polygon points="16,-5 23,0 16,5" fill="#34d399" />
  </g>

  <!-- COLUMN 3: MISSION COMMAND UI -->
  <g transform="translate(565, 75)">
    <rect width="225" height="380" rx="14" fill="url(#grad-amber)" stroke="#d97706" stroke-width="1.8" />
    <rect x="0" y="0" width="225" height="42" rx="14" fill="#d97706" fill-opacity="0.25" />
    <text x="16" y="27" class="col-title" fill="#fbbf24">3. Command Center (UI)</text>

    <!-- Item 1 -->
    <g transform="translate(12, 54)">
      <rect width="201" height="56" rx="8" fill="#1c1405" stroke="#4a330a" stroke-width="1" />
      <text x="10" y="22" class="item-title">🗺️ Leaflet GIS Command Map</text>
      <text x="10" y="40" class="item-desc">Interactive satellite &amp; hazard layers</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(12, 118)">
      <rect width="201" height="56" rx="8" fill="#1c1405" stroke="#4a330a" stroke-width="1" />
      <text x="10" y="22" class="item-title">📈 SRTM Elevation Transect</text>
      <text x="10" y="40" class="item-desc">12-point geodetic terrain profile</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(12, 182)">
      <rect width="201" height="56" rx="8" fill="#1c1405" stroke="#4a330a" stroke-width="1" />
      <text x="10" y="22" class="item-title">🎯 6-Stage Guided Stepper</text>
      <text x="10" y="40" class="item-desc">Step-by-step explainable workflow</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(12, 246)">
      <rect width="201" height="56" rx="8" fill="#1c1405" stroke="#4a330a" stroke-width="1" />
      <text x="10" y="22" class="item-title">🚁 45m Helipad Visualizer</text>
      <text x="10" y="40" class="item-desc">Heavy-lift casualty evacuation zone</text>
    </g>

    <!-- Item 5 -->
    <g transform="translate(12, 310)">
      <rect width="201" height="56" rx="8" fill="#1c1405" stroke="#4a330a" stroke-width="1" />
      <text x="10" y="22" class="item-title">🌟 Cinematic Landing Page</text>
      <text x="10" y="40" class="item-desc">Logo intro + full system boot audit</text>
    </g>
  </g>

  <!-- Connective Arrow 3 -> 4 -->
  <g transform="translate(798, 260)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#fbbf24" stroke-width="3" stroke-dasharray="5,3" />
    <polygon points="16,-5 23,0 16,5" fill="#fbbf24" />
  </g>

  <!-- COLUMN 4: ACTION & OUTPUTS -->
  <g transform="translate(825, 75)">
    <rect width="210" height="380" rx="14" fill="url(#grad-purple)" stroke="#8b5cf6" stroke-width="1.8" />
    <rect x="0" y="0" width="210" height="42" rx="14" fill="#8b5cf6" fill-opacity="0.25" />
    <text x="16" y="27" class="col-title" fill="#c084fc">4. Operational Action</text>

    <!-- Item 1 -->
    <g transform="translate(12, 54)">
      <rect width="186" height="70" rx="8" fill="#150924" stroke="#3c1b63" stroke-width="1" />
      <text x="10" y="22" class="item-title">📄 Official DDMA Dossier</text>
      <text x="10" y="40" class="item-desc">Legal executive report</text>
      <text x="10" y="56" class="item-desc">Standalone HTML &amp; PDF</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(12, 132)">
      <rect width="186" height="70" rx="8" fill="#150924" stroke="#3c1b63" stroke-width="1" />
      <text x="10" y="22" class="item-title">💾 QGIS / SEOC Feed</text>
      <text x="10" y="40" class="item-desc">GeoJSON telemetry export</text>
      <text x="10" y="56" class="item-desc">Real-time incident stream</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(12, 210)">
      <rect width="186" height="92" rx="8" fill="#150924" stroke="#3c1b63" stroke-width="1" />
      <text x="10" y="22" class="item-title">🚑 Evacuation Logistics</text>
      <text x="10" y="40" class="item-desc">Buses &amp; ALS ambulances</text>
      <text x="10" y="56" class="item-desc">15 L/day water quota</text>
      <text x="10" y="72" class="item-desc">Latrines &amp; family tents</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(12, 310)">
      <rect width="186" height="56" rx="8" fill="#150924" stroke="#3c1b63" stroke-width="1" />
      <text x="10" y="22" class="item-title">✅ Zero Deficit Goal</text>
      <text x="10" y="40" class="item-desc">100% population safe</text>
    </g>
  </g>
</svg>

