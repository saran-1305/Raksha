<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="50%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c2042"/>
      <stop offset="100%" stop-color="#071224"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#062b23"/>
      <stop offset="100%" stop-color="#031713"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2106"/>
      <stop offset="100%" stop-color="#171103"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26123d"/>
      <stop offset="100%" stop-color="#140921"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 800; }
    .header-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
    .col-title { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 800; }
    .item-title { font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 700; fill: #ffffff; }
    .item-desc { font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 400; fill: #94a3b8; }
    .pill { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 800; }
  </style>

  <!-- Background Canvas -->
  <rect width="1060" height="480" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />

  <!-- Top Title Banner -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="130" height="26" rx="13" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="14" cy="13" r="4.5" fill="#38bdf8" />
    <text x="26" y="17" class="header-tag" fill="#38bdf8">RAKSHA 2.0</text>
    <text x="145" y="19" class="title" font-size="19" fill="#ffffff">SYSTEM ARCHITECTURE &amp; PIPELINE FLOW</text>
    <text x="1000" y="18" class="header-tag" fill="#64748b" text-anchor="end">EXPLAINABLE RELOCATION INTELLIGENCE</text>
  </g>

  <!-- COLUMN 1: SATELLITE & TELEMETRY -->
  <g transform="translate(25, 75)">
    <rect width="235" height="380" rx="14" fill="url(#grad-blue)" stroke="#0284c7" stroke-width="1.8" />
    <rect x="0" y="0" width="235" height="42" rx="14" fill="#0369a1" fill-opacity="0.25" />
    <text x="16" y="27" class="col-title" fill="#38bdf8">1. Earth Observation Feeds</text>
    
    <!-- Item 1: S1 SAR -->
    <g transform="translate(12, 54)">
      <rect width="211" height="56" rx="8" fill="#0b172a" stroke="#1e3a5f" stroke-width="1" />
      <text x="10" y="22" class="item-title">🛰️ Sentinel-1 C-Band SAR</text>
      <text x="10" y="40" class="item-desc">All-weather radar flood extent</text>
      <rect x="150" y="8" width="52" height="18" rx="4" fill="#0284c7" fill-opacity="0.35" />
      <text x="176" y="21" class="pill" fill="#38bdf8" text-anchor="middle">RADAR</text>
    </g>

    <!-- Item 2: S2 L2A -->
    <g transform="translate(12, 118)">
      <rect width="211" height="56" rx="8" fill="#0b172a" stroke="#1e3a5f" stroke-width="1" />
      <text x="10" y="22" class="item-title">🛰️ Sentinel-2 L2A</text>
      <text x="10" y="40" class="item-desc">10m optical multi-spectral</text>
      <rect x="146" y="8" width="56" height="18" rx="4" fill="#059669" fill-opacity="0.35" />
      <text x="174" y="21" class="pill" fill="#34d399" text-anchor="middle">OPTICAL</text>
    </g>

    <!-- Item 3: Cartosat-3 -->
    <g transform="translate(12, 182)">
      <rect width="211" height="56" rx="8" fill="#0b172a" stroke="#1e3a5f" stroke-width="1" />
      <text x="10" y="22" class="item-title">🛰️ ISRO Cartosat-3</text>
      <text x="10" y="40" class="item-desc">0.28m PAN &amp; 45m helipad audit</text>
      <rect x="148" y="8" width="54" height="18" rx="4" fill="#d97706" fill-opacity="0.35" />
      <text x="175" y="21" class="pill" fill="#fbbf24" text-anchor="middle">0.28m</text>
    </g>

    <!-- Item 4: Bhuvan -->
    <g transform="translate(12, 246)">
      <rect width="211" height="56" rx="8" fill="#0b172a" stroke="#1e3a5f" stroke-width="1" />
      <text x="10" y="22" class="item-title">🗺️ ISRO Bhuvan / NRSC</text>
      <text x="10" y="40" class="item-desc">1:50k LULC &amp; 10-Yr flood archive</text>
      <rect x="156" y="8" width="46" height="18" rx="4" fill="#7c3aed" fill-opacity="0.35" />
      <text x="179" y="21" class="pill" fill="#c084fc" text-anchor="middle">WMS</text>
    </g>

    <!-- Item 5: DEM & Weather -->
