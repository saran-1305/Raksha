      <rect width="211" height="56" rx="8" fill="#0b172a" stroke="#1e3a5f" stroke-width="1" />
      <text x="10" y="22" class="item-title">🌦️ SRTM DEM &amp; Weather</text>
      <text x="10" y="40" class="item-desc">90m elevation &amp; 24h precipitation</text>
      <rect x="144" y="8" width="58" height="18" rx="4" fill="#0284c7" fill-opacity="0.35" />
      <text x="173" y="21" class="pill" fill="#38bdf8" text-anchor="middle">TERRAIN</text>
    </g>
  </g>

  <!-- Connective Arrow 1 -> 2 -->
