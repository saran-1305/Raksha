<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <!-- Gradients for Multi-Ring Heatmap -->
    <radialGradient id="coreRisk" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#eab308" stop-opacity="0.7" />
      <stop offset="92%" stop-color="#22c55e" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Topographic Satellite Base Grid -->
  <rect width="400" height="280" fill="#080e18" rx="14" opacity="0.75" />
  
  <!-- Subtle Spatial Grid Lines -->
  <g stroke="rgba(56, 189, 248, 0.12)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="280" />
    <line x1="100" y1="0" x2="100" y2="280" />
    <line x1="150" y1="0" x2="150" y2="280" />
    <line x1="200" y1="0" x2="200" y2="280" />
    <line x1="250" y1="0" x2="250" y2="280" />
    <line x1="300" y1="0" x2="300" y2="280" />
    <line x1="350" y1="0" x2="350" y2="280" />
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
  </g>

  <!-- Topographic Elevation Contours -->
  <g fill="none" stroke="rgba(148, 163, 184, 0.28)" stroke-width="1" stroke-dasharray="3,3">
    <path d="M 20,200 Q 80,130 160,150 T 320,100" />
    <path d="M 30,240 Q 100,170 190,180 T 350,140" />
    <path d="M 40,150 Q 120,80 200,100 T 360,60" />
    <path d="M 60,100 Q 140,40 230,60 T 370,20" />
  </g>

  <!-- Landslide Runoff Drainage Line -->
  <path d="M 130,30 Q 150,100 175,150 T 205,240" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" filter="url(#glow)" opacity="0.8" />

  <!-- Outer Safe Zone Ring (Green) -->
  <path d="M 100,80 C 130,40 230,50 260,85 C 290,120 280,180 240,215 C 200,250 130,240 105,205 C 80,170 70,120 100,80 Z"
        fill="rgba(16, 185, 129, 0.25)" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3" />

  <!-- Intermediate Hazard Ring (Yellow / Amber) -->
  <path d="M 120,100 C 140,65 210,75 235,105 C 260,135 250,175 220,195 C 190,215 140,210 125,180 C 110,150 100,125 120,100 Z"
        fill="rgba(234, 179, 8, 0.42)" stroke="#eab308" stroke-width="1.5" />

  <!-- High Risk Core Zone (Red / Orange) -->
  <path d="M 140,120 C 155,90 195,95 210,120 C 225,145 215,170 195,180 C 175,190 150,185 140,165 C 130,145 125,135 140,120 Z"
        fill="url(#coreRisk)" stroke="#ef4444" stroke-width="2" filter="url(#glow)" />

  <!-- Centroid Beacon Pulse -->
  <circle cx="175" cy="140" r="4.5" fill="#ef4444" />
  <circle cx="175" cy="140" r="10" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.7">
    <animate attributeName="r" values="5;16;5" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>

